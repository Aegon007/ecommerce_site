version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ecommerce_app
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/ecommerce.db
      - STORE_NAME=Apex Goods Co.
    volumes:
      - app_data:/app/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    container_name: ecommerce_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_challenge:/var/www/certbot
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal_net

  certbot:
    image: certbot/certbot:latest
    container_name: ecommerce_certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_challenge:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - internal_net

volumes:
  app_data:
    name: ecommerce_app_data
  certbot_etc:
    name: ecommerce_certbot_etc
  certbot_var:
    name: ecommerce_certbot_var
  certbot_challenge:
    name: ecommerce_certbot_challenge

networks:
  internal_net:
    driver: bridge
