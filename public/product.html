<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details | Apex Goods Co.</title>
  <link rel="stylesheet" href="/css/styles.css?v=warm_2" />
</head>
<body>

  <!-- Top Announcement Bar -->
  <div class="announcement-bar">
    <span>Free shipping on orders $75+</span>
    <span>•</span>
    <span>Use Code <code>WELCOME10</code> for 10% off orders $50+</span>
  </div>

  <!-- Main Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="nav-brand">
        <div class="nav-brand-icon">A</div>
        <span>APEX GOODS</span>
      </a>

      <div class="nav-links" style="margin-left: auto;">
        <a href="/" class="nav-link-btn">← Back to Catalog</a>
        <a href="/cart.html" class="cart-btn">
          <span>🛒</span>
          <span>Cart</span>
          <span class="cart-count" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 2.5rem; flex: 1;">
    <!-- Breadcrumb -->
    <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.5rem;" id="breadcrumb">
      <a href="/" style="font-weight: 600;">Home</a> / <span id="breadcrumb-category">Loading...</span> / <span id="breadcrumb-title" style="color: var(--text-main); font-weight: 700;"></span>
    </div>

    <!-- Product Detail Container -->
    <div id="product-detail-container">
      <div style="text-align: center; padding: 5rem 0;">
        <p style="color: var(--text-muted); font-size: 1.1rem;">Loading product details...</p>
      </div>
    </div>

    <!-- Related Products -->
    <section style="margin: 4rem 0 5rem; border-top: 1px solid var(--border-color); padding-top: 3rem;">
      <h2 style="font-size: 1.6rem; font-weight: 900; color: var(--text-main); margin-bottom: 1.5rem;">You May Also Like</h2>
      <div class="product-grid" id="related-grid">
        <!-- Related items dynamically rendered -->
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom" style="border: none; padding-top: 0;">
      <div>© 2026 Apex Goods Co.</div>
      <a href="/">Return to Storefront</a>
    </div>
  </footer>

  <script src="/js/api.js?v=v4"></script>
  <script src="/js/cart.js?v=v4"></script>
  <script src="/js/product.js"></script>
</body>
</html>
